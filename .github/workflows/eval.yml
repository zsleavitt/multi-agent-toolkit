name: Eval Gate

on:
  pull_request:
  push:
    branches: [main]

env:
  EVAL_PASS_THRESHOLD: "0.9"

jobs:
  eval:
    name: Agent quality evals
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[otel]" pytest

      - name: Run eval suite (CI gate)
        env:
          EVAL_ARTIFACT_DIR: ${{ github.workspace }}/eval-artifacts
        run: |
          mkdir -p "$EVAL_ARTIFACT_DIR"
          python -m pytest evals/ -q --tb=short

      - name: Richer eval report (optional)
        if: always()
        env:
          EVAL_PASS_THRESHOLD: ${{ env.EVAL_PASS_THRESHOLD }}
        run: |
          mkdir -p eval-artifacts
          python evals/run_evals.py \
            --threshold "$EVAL_PASS_THRESHOLD" \
            --json-out eval-artifacts/eval-report.json \
            --markdown-out eval-artifacts/eval-summary.md \
            || true

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-artifacts/
          if-no-files-found: ignore

      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'eval-artifacts/eval-summary.md';
            let body;
            if (fs.existsSync(path)) {
              body = fs.readFileSync(path, 'utf8');
            } else {
              body = '## MAT Eval Gate\n\n_No eval summary artifact was produced._';
            }
            const marker = '<!-- mat-eval-gate -->';
            body = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
